<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Shawan Reddy</title>
    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <!-- Background Elements -->
    <div class="glow-bg-blobs">
        <div class="blob blob-indigo"></div>
        <div class="blob blob-cyan"></div>
    </div>

    <!-- Login Card -->
    <div class="login-card glass-card">
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Access the systems control dashboard</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" required placeholder=" ">
                <label for="username">Username</label>
            </div>
            
            <div class="input-group">
                <div class="password-input-wrapper">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                    <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Toggle Password Visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember session</span>
                </label>
                <a href="#" class="forgot-password" onclick="alert('Default developer credentials:\nUsername: admin\nPassword: password123')">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span>Sign In</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>

            <div id="loginFeedback" class="form-feedback"></div>
        </form>
    </div>

    <script>
        // Set dynamic theme matching saved configuration on page load
        const getCurrentTheme = () => {
            const savedTheme = localStorage.getItem('theme');
            return savedTheme || 'dark';
        };
        document.documentElement.setAttribute('data-theme', getCurrentTheme());

        // Redirect to admin.html if user is already logged in
        const checkActiveSession = () => {
            const activeSession = sessionStorage.getItem('adminSession') || localStorage.getItem('adminSession');
            if (activeSession) {
                window.location.href = 'admin.html';
            }
        };
        checkActiveSession();

        // Password visibility toggler
        const passwordField = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        
        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            passwordToggle.innerHTML = isPassword 
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        });

        // Form submit handler
        const loginForm = document.getElementById('loginForm');
        const loginFeedback = document.getElementById('loginFeedback');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            // Proper Credential verification
            if (userVal === 'admin' && passVal === 'password123') {
                const token = 'token_' + Math.random().toString(36).substr(2);
                
                if (rememberMe) {
                    localStorage.setItem('adminSession', token);
                } else {
                    sessionStorage.setItem('adminSession', token);
                }
                
                loginFeedback.textContent = 'Verification successful. Redirecting...';
                loginFeedback.className = 'form-feedback success';
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);
            } else {
                loginFeedback.textContent = 'Invalid credentials. Please try again.';
                loginFeedback.className = 'form-feedback error';
            }
        });
    </script>
</body>
</html>
